{% extends "base.html" %}

{% block title %}{{ error }}{% endblock %}

{% block content %}
<div class="container">
    <div class="error-container">
        <div class="error-content">
            <h1 class="error-title">{{ error }}</h1>
            <p class="error-message">{{ message }}</p>
            <div class="error-actions">
                <a href="{{ url_for('index') }}" class="btn btn-primary">
                    Voltar para Página Inicial
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.error-container {
    max-width: 600px;
    margin: 4rem auto;
    padding: 2rem;
    background-color: var(--surface-color);
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-sm);
    text-align: center;
}

.error-title {
    color: var(--error-color);
    margin-bottom: 1rem;
    font-size: 2rem;
}

.error-message {
    color: var(--text-secondary);
    margin-bottom: 2rem;
    font-size: 1.1rem;
}

.error-actions {
    margin-top: 2rem;
}

@media (max-width: 768px) {
    .error-container {
        margin: 2rem auto;
        padding: 1.5rem;
    }

    .error-title {
        font-size: 1.5rem;
    }

    .error-message {
        font-size: 1rem;
    }
}
</style>
{% endblock %}
