{% extends "base.html" %}

{% block title %}Editar Paciente{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <div class="text-center mb-4">
            <h1>Editar Paciente</h1>
        </div>

        <form method="POST" action="{{ url_for('editar', paciente_id=paciente_id) }}" id="formEditarPaciente" data-autosave="true">
            <input type="hidden" name="form_type" value="edit">
            <div class="form-section">
                <h2>Informações Básicas</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome" class="form-label required">Nome Completo</label>
                        <input type="text" id="nome" name="nome" class="form-input" 
                               value="{{ paciente['Nome'] }}" required minlength="3">
                    </div>

                    <div class="form-group">
                        <label for="cns" class="form-label required">CNS</label>
                        <input type="text" id="cns" name="cns" class="form-input" 
                               value="{{ paciente['CNS'] }}" required pattern="\d{15}">
                    </div>

                    <div class="form-group">
                        <label for="idade" class="form-label required">Idade</label>
                        <input type="number" id="idade" name="idade" class="form-input" 
                               value="{{ paciente['Idade'] }}" required min="0" max="120">
                    </div>

                    <div class="form-group">
                        <label for="sexo" class="form-label required">Sexo</label>
                        <select id="sexo" name="sexo" class="form-select" required>
                            <option value="Masculino" {% if paciente['Sexo'] == 'Masculino' %}selected{% endif %}>
                                Masculino
                            </option>
                            <option value="Feminino" {% if paciente['Sexo'] == 'Feminino' %}selected{% endif %}>
                                Feminino
                            </option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Condições de Saúde</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="diabetes" class="form-label required">Diabetes</label>
                        <select id="diabetes" name="diabetes" class="form-select" required>
                            <option value="Sim" {% if paciente['Diabetes'] == 'Sim' %}selected{% endif %}>Sim</option>
                            <option value="Não" {% if paciente['Diabetes'] == 'Não' %}selected{% endif %}>Não</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="hipertensao" class="form-label required">Hipertensão</label>
                        <select id="hipertensao" name="hipertensao" class="form-select" required>
                            <option value="Sim" {% if paciente['Hipertensão'] == 'Sim' %}selected{% endif %}>Sim</option>
                            <option value="Não" {% if paciente['Hipertensão'] == 'Não' %}selected{% endif %}>Não</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tratamento_hipertensao" class="form-label required">Em Tratamento para Hipertensão</label>
                        <select id="tratamento_hipertensao" name="tratamento_hipertensao" class="form-select" required>
                            <option value="Sim" {% if paciente['Tratamento Hipertensão'] == 'Sim' %}selected{% endif %}>Sim</option>
                            <option value="Não" {% if paciente['Tratamento Hipertensão'] == 'Não' %}selected{% endif %}>Não</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fumante" class="form-label required">Fumante</label>
                        <select id="fumante" name="fumante" class="form-select" required>
                            <option value="Sim" {% if paciente['Fumante'] == 'Sim' %}selected{% endif %}>Sim</option>
                            <option value="Não" {% if paciente['Fumante'] == 'Não' %}selected{% endif %}>Não</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="internacao_recente" class="form-label required">Internação Recente</label>
                        <select id="internacao_recente" name="internacao_recente" class="form-select" required>
                            <option value="Sim" {% if paciente['Internação Recente'] == 'Sim' %}selected{% endif %}>Sim</option>
                            <option value="Não" {% if paciente['Internação Recente'] == 'Não' %}selected{% endif %}>Não</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Exames</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="colesterol_total" class="form-label required">Colesterol Total (mg/dL)</label>
                        <input type="number" id="colesterol_total" name="colesterol_total" 
                               value="{{ paciente['Colesterol Total'] }}" class="form-input" 
                               required min="0" step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="hdl" class="form-label required">HDL (mg/dL)</label>
                        <input type="number" id="hdl" name="hdl" 
                               value="{{ paciente['HDL'] }}" class="form-input" 
                               required min="0" step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="pressao_sistolica" class="form-label required">Pressão Sistólica (mmHg)</label>
                        <input type="number" id="pressao_sistolica" name="pressao_sistolica" 
                               value="{{ paciente['Pressão Sistólica'] }}" class="form-input" 
                               required min="0" max="300">
                    </div>

                    <div class="form-group">
                        <label for="creatinina_serica" class="form-label required">Creatinina Sérica (mg/dL)</label>
                        <input type="number" id="creatinina_serica" name="creatinina_serica" 
                               value="{{ paciente['Creatinina Sérica'] }}" class="form-input" 
                               required min="0" step="0.01">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Comorbidades</h2>
                <div class="checkbox-group">
                    {% for comorbidade in comorbidades %}
                    <div class="checkbox-item">
                        <input type="checkbox" id="comorbidade_{{ loop.index }}" 
                               name="comorbidades" value="{{ comorbidade }}" 
                               class="custom-checkbox"
                               {% if paciente[comorbidade] == 'Sim' %}checked{% endif %}>
                        <label for="comorbidade_{{ loop.index }}" class="checkbox-label">
                            {{ comorbidade }}
                        </label>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="form-section">
                <h2>Medicamentos</h2>
                <div class="form-group">
                    <label for="medicamentos" class="form-label">Medicamentos em Uso</label>
                    <textarea id="medicamentos" name="medicamentos" 
                              class="form-textarea">{{ paciente['Medicamentos'] }}</textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Voltar</a>
                <button type="button" class="btn btn-danger" 
                        onclick="if(confirm('Tem certeza que deseja remover este paciente?')) 
                                document.getElementById('formRemover').submit();">
                    Remover Paciente
                </button>
            </div>
        </form>

        <form id="formRemover" method="POST" 
              action="{{ url_for('remover', paciente_id=paciente_id) }}" 
              style="display: none;">
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('formEditarPaciente').addEventListener('submit', function(e) {
    const hdl = parseFloat(document.getElementById('hdl').value);
    const colesterolTotal = parseFloat(document.getElementById('colesterol_total').value);
    
    if (hdl > colesterolTotal) {
        e.preventDefault();
        alert('O HDL não pode ser maior que o Colesterol Total');
    }
});
</script>
{% endblock %}
